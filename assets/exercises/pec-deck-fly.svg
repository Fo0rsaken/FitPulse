  <line x1="570" y1="210" x2="570" y2="390" stroke="#475569" stroke-width="11" stroke-linecap="round"/>
  <!-- Seated athlete front view -->
  <line x1="365" y1="505" x2="335" y2="616" stroke="#242C3D" stroke-width="26" stroke-linecap="round"/>
  <line x1="435" y1="505" x2="465" y2="616" stroke="#242C3D" stroke-width="26" stroke-linecap="round"/>
  <g>
      <path d="M346 610 L306 618 Q298 626 306 634 L348 634 Z" fill="#242C3D"/>
      <line x1="348" y1="633" x2="304" y2="633" stroke="#B8F228" stroke-width="5" stroke-linecap="round"/>
    </g>
  <g>
      <path d="M454 610 L494 618 Q502 626 494 634 L452 634 Z" fill="#242C3D"/>
      <line x1="452" y1="633" x2="496" y2="633" stroke="#B8F228" stroke-width="5" stroke-linecap="round"/>
    </g>
  <rect x="352" y="328" width="96" height="158" rx="28" fill="#313B4F"/>
  <line x1="354" y1="448" x2="446" y2="448" stroke="#B8F228" stroke-width="6"/>
  <ellipse cx="400" cy="372" rx="42" ry="20" transform="rotate(0 400 372)" fill="#B8F228" opacity="0.22"/>
  <circle cx="400" cy="286" r="28" fill="#D5A688"/><path d="M372 282 C372 250, 428 250, 428 282 C420 272, 380 272, 372 282 Z" fill="#1C2331"/>
  <!-- Arms open on handles -->
  <line x1="356" y1="355" x2="255" y2="372" stroke="#D5A688" stroke-width="24" stroke-linecap="round"/>
  <line x1="255" y1="372" x2="232" y2="345" stroke="#D5A688" stroke-width="22" stroke-linecap="round"/>
  <line x1="444" y1="355" x2="545" y2="372" stroke="#D5A688" stroke-width="24" stroke-linecap="round"/>
  <line x1="545" y1="372" x2="568" y2="345" stroke="#D5A688" stroke-width="22" stroke-linecap="round"/>

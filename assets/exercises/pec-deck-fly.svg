<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#27334A" stop-opacity="0.92"/>
      <stop offset="62%" stop-color="#1A2232" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#161B26" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="limeFade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B8F228" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#B8F228" stop-opacity="1"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="#161B26"/>
  <rect width="800" height="800" fill="url(#bgGlow)"/>
  <ellipse cx="400" cy="642" rx="285" ry="22" fill="#0C1018" opacity="0.65"/>
  <rect x="120" y="632" width="560" height="10" rx="5" fill="#232C3D"/>
  
  <!-- Machine frame behind -->

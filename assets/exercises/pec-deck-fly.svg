    <path d="M220 425 Q285 465 355 425" fill="none" stroke="#B8F228" stroke-width="6" stroke-linecap="round"/>
    <path d="M347.6 441.4 L355 425 L337.1 423.0" fill="none" stroke="#B8F228" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    

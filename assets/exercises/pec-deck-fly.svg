  <rect x="364" y="305" width="72" height="175" rx="14" fill="#1F2736" stroke="#475569" stroke-width="2.5"/>
  <rect x="335" y="485" width="130" height="24" rx="8" fill="#1F2736" stroke="#475569" stroke-width="2.5"/>

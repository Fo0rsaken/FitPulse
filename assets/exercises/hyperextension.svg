<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#27334A" stop-opacity="0.92"/>
      <stop offset="62%" stop-color="#1A2232" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#161B26" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="limeFade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B8F228" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#B8F228" stop-opacity="1"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="#161B26"/>
  <rect width="800" height="800" fill="url(#bgGlow)"/>
  <ellipse cx="400" cy="642" rx="285" ry="22" fill="#0C1018" opacity="0.65"/>
  <rect x="120" y="632" width="560" height="10" rx="5" fill="#232C3D"/>
  
  <!-- 45-degree Roman chair -->
  <line x1="255" y1="628" x2="430" y2="442" stroke="#283244" stroke-width="18" stroke-linecap="round"/>
  <line x1="425" y1="450" x2="455" y2="628" stroke="#283244" stroke-width="18" stroke-linecap="round"/>
  <rect x="235" y="620" width="245" height="12" rx="5" fill="#475569"/>
  <rect x="385" y="420" width="76" height="30" rx="12" fill="#1F2736" stroke="#475569" stroke-width="2.5" transform="rotate(-35 423 435)"/>
  <circle cx="290" cy="572" r="16" fill="#1F2736" stroke="#475569" stroke-width="2.5"/>
  <!-- Athlete extending torso -->
  <line x1="415" y1="422" x2="290" y2="565" stroke="#242C3D" stroke-width="30" stroke-linecap="round"/>
  <g>
      <path d="M278 576 L238 584 Q230 592 238 600 L280 600 Z" fill="#242C3D"/>
      <line x1="280" y1="599" x2="236" y2="599" stroke="#B8F228" stroke-width="5" stroke-linecap="round"/>
    </g>
  <line x1="420" y1="415" x2="535" y2="315" stroke="#313B4F" stroke-width="46" stroke-linecap="round"/>
  <line x1="414" y1="395" x2="444" y2="426" stroke="#B8F228" stroke-width="6"/>
  <ellipse cx="465" cy="368" rx="38" ry="18" transform="rotate(-40 465 368)" fill="#B8F228" opacity="0.22"/>
  <circle cx="566" cy="286" r="26" fill="#D5A688"/><path d="M540 286 C540 254, 592 254, 588 278 C560 274, 548 282, 544 294 Z" fill="#1C2331"/>
  <!-- Arms crossed on chest -->
  <line x1="515" y1="336" x2="488" y2="378" stroke="#D5A688" stroke-width="22" stroke-linecap="round"/>
  <g filter="url(#softGlow)">
    <path d="M585 440 Q632 368 610 295" fill="none" stroke="#B8F228" stroke-width="6" stroke-linecap="round"/>
    <path d="M624.3 305.9 L610 295 L604.1 312.0" fill="none" stroke="#B8F228" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
  </g>

</svg>

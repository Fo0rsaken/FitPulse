<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#27334A" stop-opacity="0.92"/>
      <stop offset="62%" stop-color="#1A2232" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#161B26" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="limeFade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B8F228" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#B8F228" stop-opacity="1"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="#161B26"/>
  <rect width="800" height="800" fill="url(#bgGlow)"/>
  <ellipse cx="400" cy="642" rx="285" ry="22" fill="#0C1018" opacity="0.65"/>
  <rect x="120" y="632" width="560" height="10" rx="5" fill="#232C3D"/>
  
  <!-- Pull-up bar -->
  <rect x="245" y="150" width="16" height="482" rx="4" fill="#283244"/>
  <rect x="245" y="160" width="230" height="15" rx="6" fill="#475569"/>
  <!-- Athlete hanging and raising straight legs to 90 deg -->
  <line x1="384" y1="170" x2="384" y2="280" stroke="#D5A688" stroke-width="22" stroke-linecap="round"/>
  <circle cx="396" cy="255" r="25" fill="#D5A688"/><path d="M371 255 C371 224, 421 224, 417 247 C390 243, 379 251, 375 263 Z" fill="#1C2331"/>
  <line x1="384" y1="286" x2="384" y2="424" stroke="#313B4F" stroke-width="46" stroke-linecap="round"/>
  <line x1="362" y1="402" x2="406" y2="402" stroke="#B8F228" stroke-width="6"/>
  <ellipse cx="396" cy="374" rx="22" ry="34" transform="rotate(0 396 374)" fill="#B8F228" opacity="0.22"/>
  <!-- Legs lifted horizontally -->
  <line x1="388" y1="426" x2="512" y2="414" stroke="#242C3D" stroke-width="30" stroke-linecap="round"/>
  <line x1="512" y1="414" x2="608" y2="404" stroke="#D5A688" stroke-width="24" stroke-linecap="round"/>
  <g>
      <path d="M606 388 L646 396 Q654 404 646 412 L604 412 Z" fill="#242C3D"/>
      <line x1="604" y1="411" x2="648" y2="411" stroke="#B8F228" stroke-width="5" stroke-linecap="round"/>
    </g>
  <g filter="url(#softGlow)">
    <path d="M488 565 Q565 525 595 446" fill="none" stroke="#B8F228" stroke-width="6" stroke-linecap="round"/>
    <path d="M599.7 463.4 L595 446 L579.9 455.9" fill="none" stroke="#B8F228" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
  </g>

</svg>

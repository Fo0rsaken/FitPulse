    </g>
  <!-- Torso angled slightly forward -->
  <line x1="396" y1="412" x2="434" y2="278" stroke="#313B4F" stroke-width="50" stroke-linecap="round"/>
  <line x1="376" y1="388" x2="424" y2="400" stroke="#B8F228" stroke-width="6"/>
  <ellipse cx="428" cy="318" rx="26" ry="20" transform="rotate(0 428 318)" fill="#B8F228" opacity="0.22"/>

  <line x1="374" y1="342" x2="378" y2="366" stroke="#B8886A" stroke-width="20" stroke-linecap="round"/>
  <line x1="436" y1="294" x2="416" y2="348" stroke="#D5A688" stroke-width="24" stroke-linecap="round"/>
  <line x1="416" y1="348" x2="424" y2="366" stroke="#D5A688" stroke-width="22" stroke-linecap="round"/>
